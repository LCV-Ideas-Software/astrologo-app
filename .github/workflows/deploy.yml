name: Deploy

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-production
    permissions:
      contents: read # Read the exact source revision being deployed.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false

      - name: Install repository validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate repository and public pages
        run: |
          npm run lint
          npm run format:public:check

      - name: Install frontend dependencies
        working-directory: astrologo-frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate frontend and Pages Functions
        working-directory: astrologo-frontend
        run: |
          npm run lint
          npm run biome
          npm test
          npm run build

      - name: Build exact Pages Functions artifact
        working-directory: astrologo-frontend
        run: |
          test ! -e dist/_worker.js
          test ! -e dist/_routes.json
          mkdir -p .wrangler/pages-custody
          npm exec -- wrangler pages functions build functions --outdir=dist/_worker.js --metafile=.wrangler/pages-custody/metafile.json --output-config-path=.wrangler/pages-custody/functions-config.json --output-routes-path=dist/_routes.json --build-output-directory=dist --project-directory=. --build-metadata-path=.wrangler/pages-custody/build-metadata.json

      - name: Preserve exact Pages deployment inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-runtime-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            astrologo-frontend/dist
            astrologo-frontend/.wrangler/pages-custody
            astrologo-frontend/package-lock.json
            astrologo-frontend/wrangler.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Deploy Pages application with Wrangler
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          workingDirectory: astrologo-frontend
          wranglerVersion: 4.147.0
          command: pages deploy dist --no-bundle --project-name=astrologo-frontend --branch=main --commit-dirty=true
