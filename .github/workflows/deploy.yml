name: Deploy
on:
  push:
    branches: [main]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--no-deprecation"
concurrency:
  group: deploy-main
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy application
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
          cache-dependency-path: |
            ./astrologo-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: ./astrologo-frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact Wrangler dependency
        id: wrangler
        working-directory: ./astrologo-frontend
        shell: bash
        run: |
          set -euo pipefail
          effective_registry="$(npm config get registry)"
          if [ "$effective_registry" != "https://registry.npmjs.org/" ]; then
            echo "::error::Unexpected npm registry: $effective_registry" >&2
            exit 1
          fi
          expected_version="$(node -p "require('./package.json').devDependencies.wrangler")"
          if ! [[ "$expected_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Wrangler must be declared with an exact SemVer: $expected_version" >&2
            exit 1
          fi
          installed_version="$(node -p "require('./node_modules/wrangler/package.json').version")"
          if [ "$installed_version" != "$expected_version" ]; then
            echo "::error::Installed Wrangler $installed_version differs from manifest $expected_version" >&2
            exit 1
          fi
          npm audit signatures
          npm audit --audit-level=low

          WRANGLER_BIN="$PWD/node_modules/.bin/wrangler"
          if [ ! -x "$WRANGLER_BIN" ]; then
            echo "::error::The lockfile-installed Wrangler executable was not created." >&2
            exit 1
          fi
          WRANGLER_VERSION="$("$WRANGLER_BIN" --version)"
          if [ "$WRANGLER_VERSION" != "$expected_version" ]; then
            echo "::error::Wrangler executable reported $WRANGLER_VERSION, expected $expected_version" >&2
            exit 1
          fi

          printf 'Resolved Wrangler version: %s\n' "$WRANGLER_VERSION"
          printf 'bin=%s\nversion=%s\n' "$WRANGLER_BIN" "$WRANGLER_VERSION" >> "$GITHUB_OUTPUT"
      - name: Reject tracked executable artifacts
        working-directory: ./astrologo-frontend
        run: node scripts/check-tracked-executables.mjs
      - name: Install + Build Frontend
        working-directory: ./astrologo-frontend
        run: |
          npm run lint
          npm run biome
          npm test
          npm run build
          npm run prepare:swiss-wasm
          "$WRANGLER_BIN" pages functions build --outdir=.wrangler/functions-build-check
        env:
          WRANGLER_BIN: ${{ steps.wrangler.outputs.bin }}
      - name: Inject D1 database_id from secret
        working-directory: ./astrologo-frontend
        run: |
          if [ -z "${D1_DATABASE_ID:-}" ]; then
            echo "::error::D1_DATABASE_ID secret is not set" >&2
            exit 1
          fi
          jq --arg id "$D1_DATABASE_ID" '.d1_databases[0].database_id = $id' wrangler.json > wrangler.json.tmp
          mv wrangler.json.tmp wrangler.json
          grep -q "$D1_DATABASE_ID" wrangler.json || { echo "::error::Substitution failed" >&2; exit 1; }
          if grep -q "00000000-0000-0000-0000-000000000000" wrangler.json; then
            echo "::error::Placeholder still present after mutation" >&2
            exit 1
          fi
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      - name: Deploy Frontend
        working-directory: ./astrologo-frontend
        run: |
          "$WRANGLER_BIN" pages deploy dist --project-name=astrologo-frontend --branch=main --commit-dirty=true
        env:
          WRANGLER_BIN: ${{ steps.wrangler.outputs.bin }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    timeout-minutes: 30
permissions: {}
