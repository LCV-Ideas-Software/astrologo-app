name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 8 * * 1"

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # Upload the Scorecard SARIF analysis.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 5
          if-no-files-found: error
      - name: Upload SARIF to code-scanning
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: scorecard-results.sarif

  policy:
    name: Enforce Scorecard policy
    needs: scorecard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Download Scorecard SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scorecard-results
      - name: Require Scorecard SARIF
        shell: bash
        run: test -s scorecard-results.sarif
      - name: Test Scorecard policy enforcement
        run: >-
          node --test
          .github/scripts/enforce-scorecard.test.mjs
          .github/scripts/scorecard-workflow.test.mjs
      - name: Enforce approved Scorecard policy
        run: node .github/scripts/enforce-scorecard.mjs scorecard-results.sarif

  enforce-binary-artifacts:
    name: Reject unverified binary artifacts
    needs: scorecard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download Scorecard SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scorecard-results
      - name: Reject unverified binary artifacts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { scorecardResults } from './.github/scripts/enforce-scorecard.mjs';

          const sarif = JSON.parse(readFileSync('scorecard-results.sarif', 'utf8'));
          const findings = scorecardResults(sarif).filter((result) => result.ruleId === 'BinaryArtifactsID');
          if (findings.length > 0) {
            for (const finding of findings) {
              const location = finding.locations?.[0]?.physicalLocation?.artifactLocation?.uri ?? 'local desconhecido';
              console.error(`::error file=${location}::OpenSSF Scorecard detectou artefato binário não verificado.`);
            }
            process.exit(1);
          }
          console.log('OpenSSF Scorecard não detectou artefatos binários não verificados.');
          NODE
