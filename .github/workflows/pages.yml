# This workflow is managed by gh actions-lock.

name: Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read # Read the existing Pages configuration before building.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            astrologo-frontend/package-lock.json

      - name: Install public-page dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies
        working-directory: astrologo-frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify third-party inventory contract
        run: npm run verify:thirdparty

      - name: Check public page formatting
        run: npm run format:public:check

      - name: Validate frontend
        working-directory: astrologo-frontend
        run: |
          npm run lint
          npm run biome
          npm test
          npm run build
          npm run build:functions

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Request the OIDC token used by Pages deployment.
      pages: write # Publish the validated Pages artifact.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
