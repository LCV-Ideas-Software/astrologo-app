name: Public Format
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions: write-all
jobs:
  prettier-public:
    permissions: write-all
    name: Check index.html formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            astrologo-frontend/package-lock.json
      - name: Reject tracked executable artifacts
        working-directory: astrologo-frontend
        run: node scripts/check-tracked-executables.mjs
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --ignore-scripts --no-audit --no-fund
      - name: Check public page formatting
        run: npm run format:public:check
      - name: Install frontend dependencies
        working-directory: astrologo-frontend
        run: npm ci --registry=https://registry.npmjs.org/ --ignore-scripts --no-audit --no-fund
      - name: Validate frontend
        working-directory: astrologo-frontend
        run: |
          npm run lint
          npm run biome
          npm test
          npm run build
          npm run build:functions
    timeout-minutes: 15
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false
