version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    cooldown:
      default-days: 7
      exclude:
        - "actions/*"
        - "github/*"
    rebase-strategy: auto
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      minor-e-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/astrologo-frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    cooldown:
      default-days: 7
    rebase-strategy: auto
    ignore:
      # typescript-eslint supports TypeScript only below 6.1.0.
      # Remove this constraint as soon as the upstream peer range supports it.
      - dependency-name: "typescript"
        versions:
          - ">=6.1.0"
    labels:
      - "dependencies"
      - "npm"
      - "frontend"
    commit-message:
      prefix: "deps"
      include: "scope"
    versioning-strategy: increase
    groups:
      minor-e-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    cooldown:
      default-days: 7
    rebase-strategy: auto
    ignore:
      # typescript-eslint supports TypeScript only below 6.1.0.
      # Remove this constraint as soon as the upstream peer range supports it.
      - dependency-name: "typescript"
        versions:
          - ">=6.1.0"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      minor-e-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
